<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Shield Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --accent: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
        --border: rgba(148, 163, 184, 0.2);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px;
      }
      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .value {
        font-size: 28px;
        font-weight: 700;
        margin-top: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .badge {
        display: inline-block;
        border-radius: 9999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
      }
      .safe { background: rgba(34,197,94,0.15); color: #86efac; }
      .monitor { background: rgba(245,158,11,0.15); color: #fcd34d; }
      .fraud { background: rgba(239,68,68,0.15); color: #fca5a5; }
      .muted { color: var(--muted); }
      .error { color: #fca5a5; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <div class="label">Click Shield</div>
          <h1>Fraud Monitoring Dashboard</h1>
        </div>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>

      <div class="cards" id="overviewCards"></div>

      <div class="grid">
        <div class="panel">
          <h3>Recent sessions</h3>
          <div id="sessionTable"></div>
        </div>
        <div class="panel">
          <h3>Fraud reasons</h3>
          <div id="fraudList"></div>
        </div>
      </div>
    </div>

    <script>
      const apiBase = 'http://localhost:8000/api/v1/dashboard';
      const tokenKey = 'clickshield_access_token';

      function getToken() {
        return localStorage.getItem(tokenKey) || '';
      }

      function setContent(nodeId, html) {
        document.getElementById(nodeId).innerHTML = html;
      }

      function buildBadge(verdict) {
        const labels = {
          SAFE: 'safe',
          MONITOR: 'monitor',
          FLAG: 'flag',
          FRAUD: 'fraud'
        };
        const cls = (verdict || 'SAFE').toLowerCase();
        return `<span class="badge ${cls}">${labels[verdict] || verdict || 'safe'}</span>`;
      }

      async function fetchJson(url) {
        const token = getToken();
        const res = await fetch(url, {
          headers: {
            'Accept': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {})
          }
        });
        if (!res.ok) {
          throw new Error(`Request failed: ${res.status} ${res.statusText}`);
        }
        return res.json();
      }

      async function loadDashboard() {
        try {
          const overview = await fetchJson(`${apiBase}/overview`);
          const sessions = await fetchJson(`${apiBase}/sessions?limit=10`);
          const fraud = await fetchJson(`${apiBase}/fraud-events?limit=10`);

          const cards = [
            ['Total Sessions', overview.total_sessions],
            ['Suspicious', overview.suspicious_sessions],
            ['Fraud', overview.fraud_sessions],
            ['Protected IPs', overview.protected_ips],
            ['Avg Risk', `${overview.average_risk_score.toFixed(1)} / 100`],
            ['High Confidence', overview.high_confidence_traffic]
          ];

          setContent(
            'overviewCards',
            cards.map(([label, value]) => `
              <div class="card">
                <div class="label">${label}</div>
                <div class="value">${value}</div>
              </div>`).join('')
          );

          const sessionRows = sessions.length
            ? `<table><thead><tr><th>Time</th><th>Verdict</th><th>Risk</th><th>IP</th><th>Browser</th></tr></thead><tbody>${sessions.map((s) => `
              <tr>
                <td>${new Date(s.created_at).toLocaleString()}</td>
                <td>${buildBadge(s.verdict)}</td>
                <td>${s.risk_score}</td>
                <td>${s.ip_address || 'n/a'}</td>
                <td>${s.browser || 'n/a'}</td>
              </tr>`).join('')}</tbody></table>`
            : '<div class="muted">No sessions yet.</div>';

          setContent('sessionTable', sessionRows);

          const fraudRows = fraud.length
            ? fraud.map((f) => `
              <div class="card" style="margin-bottom: 8px;">
                <div><strong>${f.rule_name}</strong> ${buildBadge('FRAUD')}</div>
                <div class="muted">${f.reason_text || f.reason_code}</div>
                <div class="muted">score: ${f.score_contribution} | confidence: ${f.rule_confidence}</div>
              </div>
            `).join('')
            : '<div class="muted">No fraud events yet.</div>';

          setContent('fraudList', fraudRows);
        } catch (error) {
          setContent('overviewCards', `<div class="card"><div class="label">Error</div><div class="value error">${error.message}</div></div>`);
          setContent('sessionTable', '<div class="error">Unable to load dashboard data. Make sure your auth token is set.</div>');
          setContent('fraudList', '<div class="error">Unable to load fraud events.</div>');
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
      loadDashboard();
    </script>
  </body>
</html>
